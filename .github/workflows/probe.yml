name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for p in / /assets/js/boot.js /assets/style.css /favicon.ico; do echo "== $p"; curl -4 -sS -I --max-time 20 "https://milaharys.com$p" 2>&1 | grep -iE '^HTTP|cache-control|expires|last-modified|etag'; done
          echo "== www"; curl -4 -sS -I --max-time 20 https://www.milaharys.com/ 2>&1 | grep -iE '^HTTP|location'
          echo "== ipv6 route"; curl -sS --max-time 10 "https://dns.google/resolve?name=milaharys.com&type=AAAA" | head -c 400; echo
          echo "== ipv6 reachability via external checker"; curl -sS --max-time 20 "https://ipv6-test.com/api/myip.php" ; echo; curl -sS --max-time 20 "https://api.ipv6scanner.com/v1/scan?host=milaharys.com&port=443" 2>&1 | head -c 400; echo
