name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://milaharys.github.io/me/ https://milaharys.github.io/; do
            echo "== $u"; curl -sS -L --max-time 15 -D /tmp/h -o /tmp/b "$u"; grep -iE '^HTTP|^location|^server' /tmp/h; grep -oE '<title>[^<]*|og:title" content="[^"]*|og:image" content="[^"]*' /tmp/b
          done
          echo "== version on pages"; curl -sS --max-time 15 https://milaharys.github.io/me/data/version.txt
          echo "== CNAME on pages?"; curl -sS --max-time 15 -o /dev/null -w '%{http_code}\n' https://milaharys.github.io/me/CNAME
