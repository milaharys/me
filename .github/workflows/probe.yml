name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          API=https://api.globalping.io/v1/measurements
          run() { id=$(curl -sS -X POST $API -H 'content-type: application/json' -d "$1" | jq -r .id); for i in $(seq 1 40); do r=$(curl -sS $API/$id); [ "$(echo "$r" | jq -r .status)" = finished ] && break; sleep 2; done; echo "$r"; }
          ROW='.results[] | [.probe.country, .probe.city, .probe.network, .result.status, (.result.statusCode|tostring), (.result.timings.tcp|tostring), (.result.timings.tls|tostring), (.result.timings.total|tostring), ((.result.rawOutput // "")|.[0:50]|gsub("\n";" "))] | @tsv'
          BAD='[{"tags":["ovh"],"limit":4},{"country":"PL","limit":4},{"tags":["hetzner"],"limit":4},{"country":"NL","limit":4}]'
          echo "===== A. HTTPS GET / milaharys.com (3 passes)"
          for p in 1 2 3; do echo "-- pass $p"; run "{\"type\":\"http\",\"target\":\"milaharys.com\",\"locations\":$BAD,\"measurementOptions\":{\"protocol\":\"HTTPS\",\"request\":{\"method\":\"GET\",\"path\":\"/\"}}}" | jq -r "$ROW"; done
          echo "===== B. HTTP (port 80) GET / full body, same probes"
          run "{\"type\":\"http\",\"target\":\"milaharys.com\",\"locations\":$BAD,\"measurementOptions\":{\"protocol\":\"HTTP\",\"request\":{\"method\":\"GET\",\"path\":\"/\"}}}" | jq -r "$ROW"
          echo "===== C. HTTPS GET sprinthost.ru (same hoster, other IP), same probes"
          run "{\"type\":\"http\",\"target\":\"sprinthost.ru\",\"locations\":$BAD,\"measurementOptions\":{\"protocol\":\"HTTPS\",\"request\":{\"method\":\"GET\",\"path\":\"/\"}}}" | jq -r "$ROW"
          echo "===== D. HTTPS by IP with SNI (141.8.192.31)"
          run "{\"type\":\"http\",\"target\":\"141.8.192.31\",\"locations\":$BAD,\"measurementOptions\":{\"protocol\":\"HTTPS\",\"request\":{\"host\":\"milaharys.com\",\"method\":\"GET\",\"path\":\"/\"}}}" | jq -r "$ROW"
          echo "===== E. MTR TCP/443 from OVH + Hetzner"
          run '{"type":"mtr","target":"141.8.192.31","locations":[{"tags":["ovh"],"limit":2},{"tags":["hetzner"],"limit":1}],"measurementOptions":{"protocol":"TCP","port":443,"packets":4}}' \
            | jq -r '.results[] | "--- \(.probe.city) \(.probe.network)", (.result.hops[]? | "\(.resolvedAddress // "*")\t\(.asn // [] | tostring)\tloss=\(.stats.loss)\tavg=\(.stats.avg)")'
          echo "===== F. traceroute TCP/443 from OVH Warsaw"
          run '{"type":"traceroute","target":"141.8.192.31","locations":[{"country":"PL","tags":["ovh"],"limit":1}],"measurementOptions":{"protocol":"TCP","port":443}}' | jq -r '.results[] | .result.rawOutput'
