name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "AAAA: $(dig +short milaharys.com AAAA @ns1.sprinthost.ru) | www: $(dig +short www.milaharys.com AAAA @ns1.sprinthost.ru)"
          echo "version: $(curl -4 -sS --max-time 20 https://milaharys.com/data/version.txt)"
          echo "title: $(curl -4 -sS --max-time 20 https://milaharys.com/ | grep -o '<title>[^<]*')"
          echo "boot tag: $(curl -4 -sS --max-time 20 https://milaharys.com/ | grep -o 'boot.js[^"]*')"
          echo "strip fix: $(curl -4 -sS --max-time 20 'https://milaharys.com/assets/js/strip.js' | grep -c 'settled')"
          echo "htaccess: $(curl -4 -sS -I --max-time 20 https://milaharys.com/ | grep -i cache-control)"
